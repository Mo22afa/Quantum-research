<rect x="210" y="252" width="609.664" height="40" rx="9" fill="url(#q)"/>
<g font-size="18" font-weight="750" fill="#fff" text-anchor="end"><text x="920" y="127">95.28%</text><text x="920" y="203">95.09%</text><text x="920" y="279">95.26%</text></g>
