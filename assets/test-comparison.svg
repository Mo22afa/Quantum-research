<svg xmlns="http://www.w3.org/2000/svg" width="960" height="366" viewBox="0 0 960 366" role="img" aria-label="Final test performance comparison: CNN accuracy 95.28%, MLP 95.09%, Hybrid Quantum 95.26%">
